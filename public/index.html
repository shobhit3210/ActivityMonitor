<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Team Activity Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Team Activity Monitor</h1>
    <p>Ask something like: "What is Alice working on these days?"</p>

    <div id="chat">
      <div id="messages"></div>
      <form id="form">
        <input type="text" id="input" autocomplete="off" placeholder="Type your question..." required />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
